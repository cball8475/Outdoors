# Netlify build for the Catch Log PWA (apps/catch-log).
# Site: https://catch-log-sc.netlify.app
[build]
  base = "apps/catch-log"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker must never be cached, or phones won't pick up new versions.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
